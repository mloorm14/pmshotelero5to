<!--
  Sprite de iconos del PMS Hotelero. Trazo unico (stroke-based), sin relleno
  salvo pequenos puntos de acento, pensado para heredar color via
  `currentColor` (clases de texto como `text-wine-700`). viewBox 0 0 24 24,
  stroke-width 1.75 consistente en todo el set.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-reservations" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
    <line x1="3.5" y1="10" x2="20.5" y2="10"/>
    <line x1="8" y1="3" x2="8" y2="7"/>
    <line x1="16" y1="3" x2="16" y2="7"/>
    <circle cx="8.5" cy="15" r="1.1" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="icon-reception" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="4"/>
    <line x1="10.8" y1="10.8" x2="19.5" y2="19.5"/>
    <line x1="15.5" y1="15.5" x2="17.7" y2="13.3"/>
    <line x1="17.8" y1="17.8" x2="20" y2="15.6"/>
  </symbol>

  <symbol id="icon-checkout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5.5" width="19" height="13" rx="2"/>
    <line x1="2.5" y1="9.5" x2="21.5" y2="9.5"/>
    <line x1="5.5" y1="14.5" x2="9.5" y2="14.5"/>
  </symbol>

  <symbol id="icon-housekeeping" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="3" x2="9" y2="12"/>
    <path d="M9 12 4.5 20 9 18.3 12.5 19.5 9 12Z"/>
  </symbol>

  <symbol id="icon-reports" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="20.5" x2="21" y2="20.5"/>
    <line x1="6.5" y1="20" x2="6.5" y2="12"/>
    <line x1="12" y1="20" x2="12" y2="5.5"/>
    <line x1="17.5" y1="20" x2="17.5" y2="15"/>
  </symbol>

  <symbol id="icon-about" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <line x1="12" y1="11" x2="12" y2="16.2"/>
    <circle cx="12" cy="7.6" r="0.9" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="icon-rooms" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="2.7" width="12" height="18.6" rx="1.2"/>
    <circle cx="14.7" cy="12" r="0.9" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="icon-availability" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2"/>
    <line x1="3.5" y1="10" x2="20.5" y2="10"/>
    <line x1="8" y1="3" x2="8" y2="7"/>
    <line x1="16" y1="3" x2="16" y2="7"/>
    <path d="M8.3 15.2 10.6 17.5 15.5 12.6"/>
  </symbol>

  <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
  </symbol>

  <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="4" y1="7" x2="20" y2="7"/>
    <path d="M9 7V4.6h6V7"/>
    <path d="M6.3 7 7.2 20a1 1 0 0 0 1 1h7.6a1 1 0 0 0 1-1L17.7 7"/>
    <line x1="10.2" y1="11" x2="10.2" y2="17"/>
    <line x1="13.8" y1="11" x2="13.8" y2="17"/>
  </symbol>

  <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.5 4.5 20 8 8.2 19.8 4.2 20.5l0.7-4Z"/>
  </symbol>

  <symbol id="icon-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.7 21 20H3Z"/>
    <line x1="12" y1="9.5" x2="12" y2="14.5"/>
    <circle cx="12" cy="17.3" r="0.9" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="icon-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <line x1="12" y1="7" x2="12" y2="12.5"/>
    <line x1="12" y1="12.5" x2="15.5" y2="14.5"/>
  </symbol>

  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="6" y1="6" x2="18" y2="18"/>
    <line x1="6" y1="18" x2="18" y2="6"/>
  </symbol>

  <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 5.5 8.5 12 15 18.5"/>
  </symbol>

  <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5.5 15.5 12 9 18.5"/>
  </symbol>

  <symbol id="icon-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="3.5" width="11" height="17" rx="1"/>
    <line x1="19.5" y1="20.5" x2="19.5" y2="9.5"/>
    <path d="M15.5 9.5h4v11h-4"/>
    <line x1="7.5" y1="7.5" x2="7.5" y2="7.5"/>
    <line x1="7.5" y1="11" x2="7.5" y2="11"/>
    <line x1="7.5" y1="14.5" x2="7.5" y2="14.5"/>
    <line x1="11.5" y1="7.5" x2="11.5" y2="7.5"/>
    <line x1="11.5" y1="11" x2="11.5" y2="11"/>
    <line x1="11.5" y1="14.5" x2="11.5" y2="14.5"/>
  </symbol>

  <symbol id="icon-cash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="4" x2="12" y2="20"/>
    <path d="M16 7.5c0-1.66-1.79-3-4-3s-4 1.34-4 3 1.79 2.4 4 3 4 1.34 4 3-1.79 3-4 3-4-1.34-4-3"/>
  </symbol>

  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12.5 9.5 17.5 19.5 6.5"/>
  </symbol>
</svg>
